<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080a0f;
    overflow: hidden;
  }

  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080a0f;
  }

  /* Background decoratives */
  .bg-glow-main {
    position: absolute;
    width: 900px;
    height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 200, 150, 0.07) 0%, transparent 65%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
  }

  .bg-glow-left {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(100, 80, 220, 0.05) 0%, transparent 70%);
    top: 20%;
    left: -80px;
    pointer-events: none;
    z-index: 0;
  }

  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 200, 150, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 200, 150, 0.025) 1px, transparent 1px);
    background-size: 80px 80px;
    z-index: 0;
  }

  .corner-deco-tl {
    position: absolute;
    top: 60px;
    left: 60px;
    width: 48px;
    height: 48px;
    border-top: 2px solid rgba(0, 200, 150, 0.35);
    border-left: 2px solid rgba(0, 200, 150, 0.35);
    z-index: 1;
  }

  .corner-deco-br {
    position: absolute;
    bottom: 60px;
    right: 60px;
    width: 48px;
    height: 48px;
    border-bottom: 2px solid rgba(0, 200, 150, 0.35);
    border-right: 2px solid rgba(0, 200, 150, 0.35);
    z-index: 1;
  }

  .accent-line-bottom {
    position: absolute;
    bottom: 100px;
    left: 160px;
    height: 1px;
    width: 0;
    background: linear-gradient(90deg, #00c896, rgba(0, 200, 150, 0));
    z-index: 1;
  }

  /* Main content */
  .scene-content {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 120px 180px;
    position: relative;
    z-index: 2;
  }

  .tag-label {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 18px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #00c896;
    opacity: 0.65;
    margin-bottom: 56px;
    font-weight: 400;
  }

  .typing-row {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 48px;
  }

  .prompt-symbol {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 72px;
    color: #00c896;
    font-weight: 700;
    margin-right: 24px;
    line-height: 1;
    opacity: 0;
  }

  .typed-text {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 72px;
    color: #dde3f0;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .blinking-cursor {
    display: inline-block;
    width: 4px;
    height: 76px;
    background: #00c896;
    margin-left: 6px;
    vertical-align: middle;
    border-radius: 2px;
    opacity: 0;
  }

  .subtext-row {
    display: flex;
    align-items: center;
    gap: 20px;
    opacity: 0;
  }

  .subtext-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00c896;
    flex-shrink: 0;
  }

  .subtext {
    font-family: 'Inter', 'Helvetica Neue', sans-serif;
    font-size: 26px;
    color: #4a5568;
    font-weight: 300;
    letter-spacing: 0.06em;
  }

  .status-badge {
    position: absolute;
    top: 80px;
    right: 180px;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #00c896;
  }

  .status-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: rgba(0, 200, 150, 0.6);
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>
<div data-composition-id="root" data-start="0" data-width="1920" data-height="1080">

  <!-- Background layers -->
  <div class="bg-glow-main" id="glow-main"></div>
  <div class="bg-glow-left" id="glow-left"></div>
  <div class="grid-overlay"></div>
  <div class="corner-deco-tl" id="corner-tl"></div>
  <div class="corner-deco-br" id="corner-br"></div>
  <div class="accent-line-bottom" id="accent-line"></div>

  <!-- Main content -->
  <div class="scene-content">

    <!-- Status badge -->
    <div class="status-badge" id="status-badge">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text">TEACHER OS · READY</span>
    </div>

    <div class="tag-label" id="tag-label">// 打字動畫</div>

    <div class="typing-row">
      <span class="prompt-symbol" id="prompt">❯</span>
      <span class="typed-text" id="typed-text"></span>
      <span class="blinking-cursor" id="cursor"></span>
    </div>

    <div class="subtext-row" id="subtext-row">
      <div class="subtext-dot"></div>
      <span class="subtext">Teacher OS &nbsp;·&nbsp; 學生追蹤系統 v4.1</span>
    </div>

  </div>
</div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};

  var DURATION = 11;
  var TEXT = "Hello ! Jessie 妳今天過得好嗎？";
  var typedEl = document.getElementById("typed-text");

  var tl = gsap.timeline({ paused: true });

  // --- Background ambient ---
  tl.to("#glow-main", {
    scale: 1.18,
    opacity: 0.75,
    duration: 4,
    yoyo: true,
    repeat: 2,
    ease: "sine.inOut"
  }, 0);

  tl.to("#glow-left", {
    scale: 1.2,
    x: 30,
    duration: 5,
    yoyo: true,
    repeat: 1,
    ease: "sine.inOut"
  }, 0.5);

  // --- Corner decoratives fade in ---
  tl.fromTo("#corner-tl",
    { opacity: 0 },
    { opacity: 1, duration: 0.6, ease: "power2.out" },
    0.1
  );
  tl.fromTo("#corner-br",
    { opacity: 0 },
    { opacity: 1, duration: 0.6, ease: "power2.out" },
    0.25
  );

  // --- Status badge ---
  tl.fromTo("#status-badge",
    { opacity: 0, y: -12 },
    { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" },
    0.15
  );

  // Status dot pulse
  tl.to("#status-dot", {
    opacity: 0.3,
    duration: 0.7,
    yoyo: true,
    repeat: Math.floor(DURATION / 1.4) - 1,
    ease: "sine.inOut"
  }, 0.2);

  // --- Tag label ---
  tl.fromTo("#tag-label",
    { opacity: 0, x: -24 },
    { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
    0.3
  );

  // --- Prompt symbol ---
  tl.fromTo("#prompt",
    { opacity: 0, x: -30 },
    { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" },
    0.6
  );

  // --- Cursor appears and blinks ---
  tl.fromTo("#cursor",
    { opacity: 0 },
    { opacity: 1, duration: 0.15, ease: "none" },
    0.75
  );

  var blinkRepeat = Math.floor(DURATION / 0.28) - 1;
  tl.to("#cursor", {
    opacity: 0,
    duration: 0.14,
    yoyo: true,
    repeat: blinkRepeat,
    ease: "steps(1)"
  }, 0.9);

  // --- Type each character ---
  var typeStart = 1.0;
  var typeDuration = 3.8;
  for (var i = 0; i < TEXT.length; i++) {
    (function(idx) {
      tl.call(function() {
        typedEl.textContent = TEXT.substring(0, idx + 1);
      }, null, typeStart + (idx / TEXT.length) * typeDuration);
    })(i);
  }

  // --- Subtext row fades in after typing finishes ---
  tl.fromTo("#subtext-row",
    { opacity: 0, y: 18 },
    { opacity: 1, y: 0, duration: 0.65, ease: "power2.out" },
    typeStart + typeDuration + 0.5
  );

  // --- Accent line draws in ---
  tl.to("#accent-line", {
    width: 680,
    duration: 0.9,
    ease: "power3.out"
  }, typeStart + typeDuration + 0.3);

  window.__timelines["root"] = tl;
</script>
</body>
</html>
